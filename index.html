<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Детектор положения — скелет</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b1729;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            color: #fff;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #1a2b3f;
            border-radius: 40px;
            padding: 22px 18px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            border: 1px solid #314a66;
        }
        h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 small {
            font-size: 0.9rem;
            opacity: 0.6;
            font-weight: 300;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0a121c;
            border-radius: 28px;
            overflow: hidden;
            margin: 14px 0 18px;
            border: 2px solid #3f597a;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }
        #skeletonCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }
        .live-status {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        .status-badge {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
        }
        .status-badge .icon {
            font-size: 2rem;
            line-height: 1;
        }
        .status-safe {
            background: rgba(34, 197, 94, 0.3);
            border-color: #4ade80;
            color: #dcfce7;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }
        .status-danger {
            background: rgba(239, 68, 68, 0.4);
            border-color: #f87171;
            color: #fecaca;
            animation: pulse-danger 1.2s infinite;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
        }
        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #142433;
            padding: 12px 18px;
            border-radius: 40px;
            margin: 6px 0 14px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            border: 1px solid #2d4560;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.9;
        }
        .info-item span {
            font-weight: 600;
            color: #b6d0e8;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background: #4ade80;
            transition: 0.2s;
        }
        .dot-danger {
            background: #f87171;
            animation: blink-dot 0.8s infinite;
        }
        @keyframes blink-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 8px 0 6px;
        }
        .btn {
            background: #2f4460;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #4a637f;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #3b6ea0;
            border-color: #6b9ed4;
        }
        .btn-primary:hover:not(:disabled) {
            background: #4a7fb3;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #b13e3e;
            border-color: #d66a6a;
        }
        .btn-danger:hover:not(:disabled) {
            background: #c44a4a;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }

        #log {
            background: #0c1a28;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #9bb7d4;
            margin-top: 12px;
            border: 1px solid #2a4058;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footnote {
            font-size: 0.75rem;
            opacity: 0.45;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 500px) {
            .container { padding: 14px; }
            .status-badge { font-size: 1.2rem; padding: 6px 16px; gap: 6px; }
            .status-badge .icon { font-size: 1.5rem; }
            .btn { padding: 10px 14px; font-size: 0.95rem; }
            .info-panel { font-size: 0.8rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        👶 Монитор <small>скелет</small>
    </h1>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="skeletonCanvas"></canvas>
        <div class="live-status">
            <div id="statusBadge" class="status-badge status-safe">
                <span class="icon">✅</span>
                <span id="statusText">На спине</span>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-item">📷 <span id="cameraState">Ожидание</span></div>
        <div class="info-item live-indicator">
            <span id="liveDot" class="dot"></span>
            <span id="liveLabel">Онлайн</span>
        </div>
        <div class="info-item">🔄 <span id="detectState">Готов</span></div>
    </div>

    <div class="btn-group">
        <button id="startBtn" class="btn btn-primary">▶ Запуск</button>
        <button id="stopBtn" class="btn btn-danger" disabled>⏹ Стоп</button>
    </div>

    <div id="log">
        <span>🟢 Нажмите «Запуск» для начала мониторинга</span>
    </div>
    <div class="footnote">Зелёные точки — скелет. По положению точек определяется: спина или живот.</div>
</div>

<script>
    (function() {
        // --- DOM ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('skeletonCanvas');
        const ctx = canvas.getContext('2d');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const cameraState = document.getElementById('cameraState');
        const detectState = document.getElementById('detectState');
        const logEl = document.getElementById('log');
        const liveDot = document.getElementById('liveDot');
        const liveLabel = document.getElementById('liveLabel');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // --- состояние ---
        let stream = null;
        let animationId = null;
        let isRunning = false;
        let isOnBack = true;
        let lastStatus = true;

        // Аудио
        let audioCtx = null;
        let alarmInterval = null;

        // --- настройки детекции ПО СКЕЛЕТУ ---
        // Ключевые точки: голова (center), плечи, таз
        // Если плечи выше таза — спина, если таз выше плеч — живот
        const SKIN_RATIO_MIN = 0.04;

        // --- лог ---
        function logMessage(msg, isWarning = false) {
            const time = new Date().toLocaleTimeString();
            const prefix = isWarning ? '⚠️' : 'ℹ️';
            logEl.innerHTML = `<span>${prefix} [${time}] ${msg}</span>`;
        }

        // --- звук ---
        function playAlarmBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = 780;
                gain.gain.value = 0.3;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.18);

                setTimeout(() => {
                    try {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.type = 'sawtooth';
                        osc2.frequency.value = 620;
                        gain2.gain.value = 0.15;
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.start();
                        osc2.stop(audioCtx.currentTime + 0.12);
                    } catch (_) {}
                }, 80);
            } catch (e) { /* игнорируем */ }
        }

        function startAlarmLoop() {
            if (alarmInterval) return;
            playAlarmBeep();
            alarmInterval = setInterval(() => {
                if (isRunning && !isOnBack) {
                    playAlarmBeep();
                } else {
                    stopAlarmLoop();
                }
            }, 1000);
        }

        function stopAlarmLoop() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // --- ОБНОВЛЕНИЕ СТАТУСА ---
        function updateStatus(back) {
            isOnBack = back;

            if (back) {
                statusBadge.className = 'status-badge status-safe';
                statusText.innerText = 'На спине';
                document.querySelector('.status-badge .icon').innerHTML = '✅';
                detectState.innerText = 'Безопасно';
                detectState.style.color = '#86efac';
                liveDot.className = 'dot';
                liveLabel.innerText = 'Онлайн';
                stopAlarmLoop();
            } else {
                statusBadge.className = 'status-badge status-danger';
                statusText.innerText = 'НА ЖИВОТЕ!';
                document.querySelector('.status-badge .icon').innerHTML = '🔴';
                detectState.innerText = '⚠️ ТРЕВОГА';
                detectState.style.color = '#fca5a5';
                liveDot.className = 'dot dot-danger';
                liveLabel.innerText = 'ТРЕВОГА';
                startAlarmLoop();
                if (lastStatus === true) {
                    logMessage('🚨 РЕБЁНОК НА ЖИВОТЕ!', true);
                }
            }

            if (lastStatus !== back) {
                lastStatus = back;
                if (back) {
                    logMessage('🟢 Ребёнок вернулся на спину');
                }
            }
        }

        // --- ПОИСК КЛЮЧЕВЫХ ТОЧЕК ТЕЛА (упрощённый алгоритм) ---
        function findBodyPoints(imageData, w, h) {
            const data = imageData.data;
            
            // Ищем центр массы (голова) — самая яркая область с "кожей"
            let bestScore = 0;
            let headX = w/2, headY = h*0.3;
            
            // Ищем плечи и таз по горизонтальным полосам
            let shoulderY = h * 0.4;
            let hipY = h * 0.65;
            
            // Сканируем в поисках кожи
            let skinMap = [];
            for (let y = 0; y < h; y++) {
                skinMap[y] = [];
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    // Проверка на кожу
                    const isSkin = (r > g && r > b && r > 50 && g > 30 && b > 20 && 
                                   Math.abs(r-g) > 10 && r > 60);
                    skinMap[y][x] = isSkin;
                }
            }
            
            // Находим центр головы (верхняя часть, где много кожи)
            let headCandidates = [];
            for (let y = 0; y < h * 0.5; y++) {
                for (let x = 0; x < w; x++) {
                    if (skinMap[y] && skinMap[y][x]) {
                        let score = 0;
                        // Проверяем окрестность
                        for (let dy = -10; dy <= 10; dy++) {
                            for (let dx = -10; dx <= 10; dx++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                if (ny >= 0 && ny < h && nx >= 0 && nx < w && skinMap[ny] && skinMap[ny][nx]) {
                                    score++;
                                }
                            }
                        }
                        if (score > bestScore) {
                            bestScore = score;
                            headX = x;
                            headY = y;
                        }
                    }
                }
            }
            
            // Находим плечи (горизонтальная линия чуть ниже головы)
            let shoulderX = headX;
            let shoulderY2 = headY + h * 0.2;
            let hipX = headX;
            let hipY2 = headY + h * 0.45;
            
            // Уточняем плечи: ищем самую широкую часть в районе головы
            let maxWidth = 0;
            for (let y = Math.max(0, headY - 20); y < Math.min(h, headY + 40); y++) {
                let left = w, right = 0;
                for (let x = 0; x < w; x++) {
                    if (skinMap[y] && skinMap[y][x]) {
                        if (x < left) left = x;
                        if (x > right) right = x;
                    }
                }
                if (right - left > maxWidth && right - left > 20) {
                    maxWidth = right - left;
                    shoulderY2 = y;
                    shoulderX = (left + right) / 2;
                }
            }
            
            // Находим таз (нижняя часть)
            let maxHipWidth = 0;
            for (let y = Math.min(h-1, headY + 80); y < Math.min(h, headY + 150); y++) {
                let left = w, right = 0;
                for (let x = 0; x < w; x++) {
                    if (skinMap[y] && skinMap[y][x]) {
                        if (x < left) left = x;
                        if (x > right) right = x;
                    }
                }
                if (right - left > maxHipWidth && right - left > 20) {
                    maxHipWidth = right - left;
                    hipY2 = y;
                    hipX = (left + right) / 2;
                }
            }
            
            // Если не нашли кожу — возвращаем null
            if (bestScore < 50) {
                return null;
            }
            
            return {
                head: { x: headX, y: headY },
                shoulder: { x: shoulderX, y: shoulderY2 },
                hip: { x: hipX, y: hipY2 }
            };
        }

        // --- РИСОВАНИЕ СКЕЛЕТА ---
        function drawSkeleton(points, w, h) {
            ctx.clearRect(0, 0, w, h);
            
            if (!points) {
                // Рисуем сообщение "не видно"
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('👶 Не видно', w/2, h/2);
                return;
            }
            
            const { head, shoulder, hip } = points;
            
            // Рисуем линии скелета (зелёные)
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
            
            // Шея
            ctx.beginPath();
            ctx.moveTo(head.x, head.y);
            ctx.lineTo(shoulder.x, shoulder.y);
            ctx.stroke();
            
            // Позвоночник
            ctx.beginPath();
            ctx.moveTo(shoulder.x, shoulder.y);
            ctx.lineTo(hip.x, hip.y);
            ctx.stroke();
            
            // Плечи (горизонталь)
            const shoulderWidth = Math.abs(shoulder.x - head.x) * 0.8 + 30;
            ctx.beginPath();
            ctx.moveTo(shoulder.x - shoulderWidth, shoulder.y);
            ctx.lineTo(shoulder.x + shoulderWidth, shoulder.y);
            ctx.stroke();
            
            // Таз (горизонталь)
            const hipWidth = Math.abs(hip.x - head.x) * 0.7 + 25;
            ctx.beginPath();
            ctx.moveTo(hip.x - hipWidth, hip.y);
            ctx.lineTo(hip.x + hipWidth, hip.y);
            ctx.stroke();
            
            // Рисуем точки (крупные зелёные)
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#00ff88';
            
            // Голова
            ctx.beginPath();
            ctx.arc(head.x, head.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ГОЛОВА', head.x, head.y - 20);
            
            // Плечи
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(shoulder.x, shoulder.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('ПЛЕЧИ', shoulder.x, shoulder.y - 18);
            
            // Таз
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(hip.x, hip.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('ТАЗ', hip.x, hip.y - 18);
            
            // Дополнительные точки по бокам (руки, ноги) для красоты
            ctx.fillStyle = 'rgba(0, 255, 136, 0.5)';
            ctx.shadowBlur = 8;
            // Левая рука
            ctx.beginPath();
            ctx.arc(shoulder.x - shoulderWidth, shoulder.y + 20, 6, 0, Math.PI * 2);
            ctx.fill();
            // Правая рука
            ctx.beginPath();
            ctx.arc(shoulder.x + shoulderWidth, shoulder.y + 20, 6, 0, Math.PI * 2);
            ctx.fill();
            // Левая нога
            ctx.beginPath();
            ctx.arc(hip.x - hipWidth, hip.y + 25, 6, 0, Math.PI * 2);
            ctx.fill();
            // Правая нога
            ctx.beginPath();
            ctx.arc(hip.x + hipWidth, hip.y + 25, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        // --- АНАЛИЗ ПОЛОЖЕНИЯ ПО СКЕЛЕТУ ---
        function analyzeSkeleton(points) {
            if (!points) {
                return true; // не видно — считаем безопасным
            }
            
            const { head, shoulder, hip } = points;
            
            // ОСНОВНАЯ ЛОГИКА:
            // Если плечи выше таза (shoulder.y < hip.y) — спина
            // Если таз выше плеч (hip.y < shoulder.y) — живот (ребёнок согнулся)
            // Также смотрим на расстояние между плечами и тазом
            const shoulderToHip = hip.y - shoulder.y;
            
            // Если расстояние маленькое — ребёнок скручен (живот)
            if (shoulderToHip < 20) {
                return false; // живот
            }
            
            // Если плечи значительно выше таза — спина
            if (shoulderToHip > 30) {
                return true; // спина
            }
            
            // Дополнительная проверка: если голова сильно смещена вниз — живот
            if (head.y > shoulder.y + 10) {
                return false;
            }
            
            return true; // по умолчанию спина
        }

        // --- АНАЛИЗ КАДРА ---
        function analyzeFrame() {
            if (!video.videoWidth || !video.videoHeight) return;

            const w = video.videoWidth;
            const h = video.videoHeight;
            
            // Настраиваем canvas под размер видео
            canvas.width = w;
            canvas.height = h;
            
            // Рисуем видео на canvas для анализа
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, w, h);
            
            const imageData = tempCtx.getImageData(0, 0, w, h);
            
            // Находим точки тела
            const points = findBodyPoints(imageData, w, h);
            
            // Рисуем скелет
            drawSkeleton(points, w, h);
            
            // Определяем положение
            let detectedBack = true;
            if (points) {
                detectedBack = analyzeSkeleton(points);
            } else {
                detectedBack = true;
            }
            
            updateStatus(detectedBack);
        }

        // --- ЦИКЛ АНАЛИЗА ---
        function startDetectionLoop() {
            if (!isRunning) return;

            function loop() {
                if (!isRunning) return;
                try {
                    analyzeFrame();
                } catch (e) {
                    // тихо пропускаем
                }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // --- КАМЕРА ---
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                    },
                    audio: false,
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                cameraState.innerText = 'Активна';
                logMessage('📷 Камера запущена');
                return true;
            } catch (err) {
                cameraState.innerText = '❌ Ошибка';
                logMessage('❌ Ошибка камеры: ' + err.message, true);
                return false;
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            cameraState.innerText = 'Остановлена';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- ЗАПУСК / ОСТАНОВКА ---
        async function startAll() {
            if (isRunning) return;

            const ok = await startCamera();
            if (!ok) return;

            if (audioCtx && audioCtx.state === 'closed') {
                audioCtx = null;
            }

            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            lastStatus = true;
            updateStatus(true);
            logMessage('🔍 Мониторинг запущен (скелет)');

            startDetectionLoop();
        }

        function stopAll() {
            if (!isRunning) return;

            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            stopCamera();
            stopAlarmLoop();
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
                audioCtx = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            detectState.innerText = 'Остановлен';
            detectState.style.color = '#9bb7d4';
            liveDot.className = 'dot';
            liveLabel.innerText = 'Офлайн';
            logMessage('⏹ Мониторинг остановлен');
            statusBadge.className = 'status-badge status-safe';
            statusText.innerText = 'На спине';
            document.querySelector('.status-badge .icon').innerHTML = '✅';
        }

        // --- КНОПКИ ---
        startBtn.addEventListener('click', startAll);
        stopBtn.addEventListener('click', stopAll);

        window.addEventListener('load', () => {
            logMessage('🟢 Готов. Нажмите "Запуск"');
            cameraState.innerText = 'Ожидание';
            detectState.innerText = 'Готов';
            liveLabel.innerText = 'Офлайн';
        });

        window.addEventListener('beforeunload', () => {
            stopAll();
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isRunning && !isOnBack) {
                stopAlarmLoop();
                startAlarmLoop();
            }
        });

    })();
</script>

</body>
</html>
