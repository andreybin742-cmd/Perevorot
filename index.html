<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Детектор положения</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b1729;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            color: #fff;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #1a2b3f;
            border-radius: 40px;
            padding: 22px 18px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            border: 1px solid #314a66;
        }
        h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 small {
            font-size: 0.9rem;
            opacity: 0.6;
            font-weight: 300;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0a121c;
            border-radius: 28px;
            overflow: hidden;
            margin: 14px 0 18px;
            border: 2px solid #3f597a;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }
        #skeletonCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }
        .live-status {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        .status-badge {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
        }
        .status-badge .icon {
            font-size: 2rem;
            line-height: 1;
        }
        .status-safe {
            background: rgba(34, 197, 94, 0.3);
            border-color: #4ade80;
            color: #dcfce7;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }
        .status-warning {
            background: rgba(251, 191, 36, 0.35);
            border-color: #fbbf24;
            color: #fef3c7;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
        }
        .status-danger {
            background: rgba(239, 68, 68, 0.45);
            border-color: #f87171;
            color: #fecaca;
            animation: pulse-danger 1.2s infinite;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }
        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #142433;
            padding: 12px 18px;
            border-radius: 40px;
            margin: 6px 0 14px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            border: 1px solid #2d4560;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.9;
        }
        .info-item span {
            font-weight: 600;
            color: #b6d0e8;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background: #4ade80;
            transition: 0.2s;
        }
        .dot-warning {
            background: #fbbf24;
            animation: pulse-warning 1s infinite;
        }
        .dot-danger {
            background: #f87171;
            animation: blink-dot 0.8s infinite;
        }
        @keyframes pulse-warning {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes blink-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 8px 0 6px;
        }
        .btn {
            background: #2f4460;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #4a637f;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #3b6ea0;
            border-color: #6b9ed4;
        }
        .btn-primary:hover:not(:disabled) {
            background: #4a7fb3;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #b13e3e;
            border-color: #d66a6a;
        }
        .btn-danger:hover:not(:disabled) {
            background: #c44a4a;
        }
        .btn-secondary {
            background: #2d5a7a;
            border-color: #4f8ab0;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #3a6f94;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }

        #log {
            background: #0c1a28;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #9bb7d4;
            margin-top: 12px;
            border: 1px solid #2a4058;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footnote {
            font-size: 0.75rem;
            opacity: 0.45;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        .gallery-section {
            margin-top: 16px;
            border-top: 1px solid #2d4560;
            padding-top: 14px;
        }
        .gallery-title {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .gallery-title span {
            background: #2d4560;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .gallery-title .info-text {
            background: none;
            font-size: 0.7rem;
            opacity: 0.5;
            padding: 0;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 4px;
        }
        .gallery-grid::-webkit-scrollbar {
            width: 4px;
        }
        .gallery-grid::-webkit-scrollbar-track {
            background: #0c1a28;
            border-radius: 10px;
        }
        .gallery-grid::-webkit-scrollbar-thumb {
            background: #3f597a;
            border-radius: 10px;
        }
        .gallery-item {
            background: #0c1a28;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2d4560;
            position: relative;
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }
        .gallery-item .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .badge-side {
            background: #fbbf24;
            color: #0b1729;
        }
        .badge-stomach {
            background: #ef4444;
            color: white;
        }
        .gallery-item .time {
            font-size: 0.55rem;
            opacity: 0.6;
            padding: 4px 6px;
            text-align: center;
            background: #0a121c;
        }
        .gallery-empty {
            color: #4a637f;
            font-size: 0.85rem;
            padding: 20px;
            text-align: center;
            grid-column: 1 / -1;
        }
        .clear-btn {
            background: none;
            border: 1px solid #4a637f;
            color: #9bb7d4;
            padding: 2px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .clear-btn:hover {
            background: #4a637f;
            color: white;
        }

        @media (max-width: 500px) {
            .container { padding: 14px; }
            .status-badge { font-size: 1.2rem; padding: 6px 16px; gap: 6px; }
            .status-badge .icon { font-size: 1.5rem; }
            .btn { padding: 10px 14px; font-size: 0.95rem; }
            .info-panel { font-size: 0.8rem; padding: 8px 12px; }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        👶 Монитор <small>положения</small>
    </h1>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="skeletonCanvas"></canvas>
        <div class="live-status">
            <div id="statusBadge" class="status-badge status-safe">
                <span class="icon">✅</span>
                <span id="statusText">На спине</span>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-item">📷 <span id="cameraState">Ожидание</span></div>
        <div class="info-item live-indicator">
            <span id="liveDot" class="dot"></span>
            <span id="liveLabel">Онлайн</span>
        </div>
        <div class="info-item">🔄 <span id="detectState">Готов</span></div>
        <div class="info-item">⏱ <span id="timerDisplay">0с</span></div>
    </div>

    <div class="btn-group">
        <button id="startBtn" class="btn btn-primary">▶ Запуск</button>
        <button id="switchCamBtn" class="btn btn-secondary" disabled>🔄 Сменить камеру</button>
        <button id="stopBtn" class="btn btn-danger" disabled>⏹ Стоп</button>
    </div>

    <div id="log">
        <span>🟢 Нажмите «Запуск» для начала мониторинга</span>
    </div>

    <div class="gallery-section">
        <div class="gallery-title">
            <span>📸 Зафиксированные моменты</span>
            <span class="info-text">каждые 20 секунд</span>
            <span id="captureCount">0</span>
            <button class="clear-btn" id="clearGalleryBtn">Очистить</button>
        </div>
        <div class="gallery-grid" id="galleryGrid">
            <div class="gallery-empty">Здесь будут снимки при переворотах на бок или живот</div>
        </div>
    </div>

    <div class="footnote">🔊 Звуковая тревога при положении на животе. Скриншоты — каждые 20 секунд.</div>
</div>

<script>
    (function() {
        // --- DOM ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('skeletonCanvas');
        const ctx = canvas.getContext('2d');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const cameraState = document.getElementById('cameraState');
        const detectState = document.getElementById('detectState');
        const logEl = document.getElementById('log');
        const liveDot = document.getElementById('liveDot');
        const liveLabel = document.getElementById('liveLabel');
        const galleryGrid = document.getElementById('galleryGrid');
        const captureCount = document.getElementById('captureCount');
        const timerDisplay = document.getElementById('timerDisplay');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const clearGalleryBtn = document.getElementById('clearGalleryBtn');

        // --- состояние ---
        let stream = null;
        let animationId = null;
        let isRunning = false;
        let currentPosition = 'back';
        let lastPosition = 'back';
        let currentFacing = 'environment';
        let captureHistory = [];
        
        const CAPTURE_INTERVAL = 20000;
        let lastCaptureTime = 0;
        let timeSinceLastCapture = 0;
        let timerInterval = null;

        // --- ЗВУК ТРЕВОГИ ---
        let audioCtx = null;
        let alarmInterval = null;

        function playAlarmSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                
                for (let i = 0; i < 3; i++) {
                    const startTime = now + i * 0.3;
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = 880;
                    gain.gain.value = 0.4;
                    gain.gain.setValueAtTime(0.4, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.15);
                    
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.value = 660;
                    gain2.gain.value = 0.2;
                    gain2.gain.setValueAtTime(0.2, startTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, startTime + 0.12);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(startTime);
                    osc2.stop(startTime + 0.12);
                }
            } catch (e) {
                console.log('Звук не работает:', e);
            }
        }

        function startAlarmLoop() {
            if (alarmInterval) return;
            playAlarmSound();
            alarmInterval = setInterval(() => {
                if (isRunning && currentPosition === 'stomach') {
                    playAlarmSound();
                } else {
                    stopAlarmLoop();
                }
            }, 800);
        }

        function stopAlarmLoop() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // --- ТАЙМЕР ---
        function startTimer() {
            if (timerInterval) return;
            timeSinceLastCapture = 0;
            timerInterval = setInterval(() => {
                timeSinceLastCapture += 1000;
                const seconds = Math.floor(timeSinceLastCapture / 1000);
                timerDisplay.textContent = `${seconds}с`;
                if (timeSinceLastCapture >= CAPTURE_INTERVAL) {
                    timeSinceLastCapture = 0;
                    if (currentPosition === 'side' || currentPosition === 'stomach') {
                        takeScreenshot(currentPosition);
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerDisplay.textContent = '0с';
            timeSinceLastCapture = 0;
        }

        // --- СКРИНШОТ ---
        function takeScreenshot(position) {
            const now = Date.now();
            if (now - lastCaptureTime < 15000) return;
            lastCaptureTime = now;
            timeSinceLastCapture = 0;

            const w = video.videoWidth;
            const h = video.videoHeight;
            if (!w || !h) return;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, w, h);

            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);
            const date = new Date();
            const timeStr = date.toLocaleTimeString();
            const dateStr = date.toLocaleDateString();

            const entry = {
                dataUrl: dataUrl,
                position: position,
                time: timeStr,
                date: dateStr,
                timestamp: now
            };

            captureHistory.unshift(entry);
            if (captureHistory.length > 50) {
                captureHistory.pop();
            }

            renderGallery();
            const posName = position === 'side' ? 'БОК' : 'ЖИВОТ';
            logMessage(`📸 Скриншот (${posName}) ${timeStr}`, true);
        }

        // --- ГАЛЕРЕЯ ---
        function renderGallery() {
            if (captureHistory.length === 0) {
                galleryGrid.innerHTML = `<div class="gallery-empty">Здесь будут снимки при переворотах на бок или живот</div>`;
                captureCount.textContent = '0';
                return;
            }

            let html = '';
            captureHistory.forEach((entry) => {
                const badgeClass = entry.position === 'side' ? 'badge-side' : 'badge-stomach';
                const label = entry.position === 'side' ? 'БОК' : 'ЖИВОТ';
                html += `
                    <div class="gallery-item">
                        <img src="${entry.dataUrl}" alt="Скриншот ${label}" loading="lazy">
                        <span class="badge ${badgeClass}">${label}</span>
                        <div class="time">${entry.time} ${entry.date}</div>
                    </div>
                `;
            });

            galleryGrid.innerHTML = html;
            captureCount.textContent = captureHistory.length;
        }

        function clearGallery() {
            captureHistory = [];
            renderGallery();
            logMessage('🗑️ Галерея очищена');
        }

        clearGalleryBtn.addEventListener('click', clearGallery);

        // --- УПРОЩЁННЫЙ ПОИСК ТОЧЕК ---
        function findBodyPoints(imageData, w, h) {
            const data = imageData.data;
            
            let brightMap = [];
            let brightCount = 0;
            let totalX = 0, totalY = 0;
            
            for (let y = 0; y < h; y++) {
                brightMap[y] = [];
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    
                    const isBright = (r > 70 && g > 40 && b > 25 && r > g && r > b);
                    
                    brightMap[y][x] = isBright;
                    if (isBright) {
                        brightCount++;
                        totalX += x;
                        totalY += y;
                    }
                }
            }
            
            if (brightCount < 80 || brightCount > w * h * 0.6) {
                return null;
            }
            
            const centerX = totalX / brightCount;
            const centerY = totalY / brightCount;
            
            let headX = centerX, headY = centerY;
            let minY = h;
            
            for (let y = 0; y < h * 0.4; y++) {
                let count = 0;
                let sumX = 0;
                for (let x = 0; x < w; x++) {
                    if (brightMap[y] && brightMap[y][x]) {
                        count++;
                        sumX += x;
                    }
                }
                if (count > 10) {
                    minY = y;
                    headX = sumX / count;
                    headY = y;
                    break;
                }
            }
            
            if (minY === h) return null;
            
            let shoulderY = headY + h * 0.15;
            let shoulderX = headX;
            let maxWidth = 0;
            let leftX = headX, rightX = headX;
            
            for (let y = Math.max(0, headY + 5); y < Math.min(h - 1, headY + 60); y++) {
                let left = w, right = 0;
                let count = 0;
                for (let x = 0; x < w; x++) {
                    if (brightMap[y] && brightMap[y][x]) {
                        if (x < left) left = x;
                        if (x > right) right = x;
                        count++;
                    }
                }
                const width = right - left;
                if (width > maxWidth && count > 10 && width > 30) {
                    maxWidth = width;
                    shoulderY = y;
                    leftX = left;
                    rightX = right;
                    shoulderX = (left + right) / 2;
                }
            }
            
            let hipY = headY + h * 0.4;
            let hipX = headX;
            let maxHipWidth = 0;
            let hipLeft = headX, hipRight = headX;
            
            for (let y = Math.min(h - 1, headY + 40); y < Math.min(h - 1, headY + 130); y++) {
                let left = w, right = 0;
                let count = 0;
                for (let x = 0; x < w; x++) {
                    if (brightMap[y] && brightMap[y][x]) {
                        if (x < left) left = x;
                        if (x > right) right = x;
                        count++;
                    }
                }
                const width = right - left;
                if (width > maxHipWidth && count > 8 && width > 20) {
                    maxHipWidth = width;
                    hipY = y;
                    hipLeft = left;
                    hipRight = right;
                    hipX = (left + right) / 2;
                }
            }
            
            const shoulderToHip = hipY - shoulderY;
            if (shoulderToHip < 15 || shoulderToHip > h * 0.6) {
                hipY = shoulderY + h * 0.3;
                hipX = shoulderX;
                hipLeft = shoulderX - 30;
                hipRight = shoulderX + 30;
                maxHipWidth = 60;
            }
            
            return {
                head: { x: headX, y: headY },
                shoulder: { x: shoulderX, y: shoulderY, left: leftX, right: rightX },
                hip: { x: hipX, y: hipY, left: hipLeft, right: hipRight },
                shoulderWidth: maxWidth,
                hipWidth: maxHipWidth,
                brightCount: brightCount
            };
        }

        // --- РИСОВАНИЕ СКЕЛЕТА ---
        function drawSkeleton(points, w, h) {
            ctx.clearRect(0, 0, w, h);
            
            if (!points) {
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('👶 Поиск ребёнка...', w/2, h/2);
                return;
            }
            
            const { head, shoulder, hip } = points;
            
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 12;
            
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.moveTo(head.x, head.y);
            ctx.lineTo(shoulder.x, shoulder.y);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(shoulder.x, shoulder.y);
            ctx.lineTo(hip.x, hip.y);
            ctx.stroke();
            
            const shoulderW = (shoulder.right - shoulder.left) / 2;
            if (shoulderW > 5) {
                ctx.beginPath();
                ctx.moveTo(shoulder.x - shoulderW, shoulder.y);
                ctx.lineTo(shoulder.x + shoulderW, shoulder.y);
                ctx.stroke();
            }
            
            const hipW = (hip.right - hip.left) / 2;
            if (hipW > 5) {
                ctx.beginPath();
                ctx.moveTo(hip.x - hipW, hip.y);
                ctx.lineTo(hip.x + hipW, hip.y);
                ctx.stroke();
            }
            
            ctx.shadowBlur = 18;
            
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(head.x, head.y, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 0;
            ctx.fillText('ГОЛОВА', head.x, head.y - 22);
            
            ctx.fillStyle = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(shoulder.x, shoulder.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 0;
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('ПЛЕЧИ', shoulder.x, shoulder.y - 20);
            
            ctx.fillStyle = '#00ff88';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(hip.x, hip.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 0;
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('ТАЗ', hip.x, hip.y - 20);
            
            ctx.shadowBlur = 0;
        }

        // --- ОПРЕДЕЛЕНИЕ ПОЛОЖЕНИЯ ---
        function determinePosition(points, w, h) {
            if (!points) return 'back';
            
            const { head, shoulder, hip, shoulderWidth, hipWidth, brightCount } = points;
            
            if (brightCount < 50) return 'back';
            
            const shoulderToHip = hip.y - shoulder.y;
            const headToShoulder = shoulder.y - head.y;
            const widthRatio = hipWidth > 0 ? shoulderWidth / hipWidth : 1;
            const shoulderOffset = Math.abs(shoulder.x - head.x) / (shoulderWidth || 1);
            
            if (shoulderToHip < 35 && headToShoulder > 15) {
                return 'stomach';
            }
            if (widthRatio > 1.5 && shoulderWidth > 60) {
                return 'stomach';
            }
            if (headToShoulder < 20 && shoulderToHip < 45) {
                return 'stomach';
            }
            if (shoulderToHip < 25) {
                return 'stomach';
            }
            
            if (shoulderOffset > 0.4) {
                return 'side';
            }
            if (Math.abs(shoulder.x - head.x) > 35) {
                return 'side';
            }
            if (widthRatio < 0.6 && shoulderWidth < 60) {
                return 'side';
            }
            if (Math.abs(head.x - w/2) > w * 0.18) {
                return 'side';
            }
            
            if (shoulderToHip > 45 && widthRatio > 0.7 && widthRatio < 1.5 && 
                shoulderOffset < 0.35 && headToShoulder > 18) {
                return 'back';
            }
            
            return 'back';
        }

        // --- АНАЛИЗ КАДРА ---
        function analyzeFrame() {
            if (!video.videoWidth || !video.videoHeight) return;

            const w = video.videoWidth;
            const h = video.videoHeight;
            
            canvas.width = w;
            canvas.height = h;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, w, h);
            
            const imageData = tempCtx.getImageData(0, 0, w, h);
            const points = findBodyPoints(imageData, w, h);
            
            drawSkeleton(points, w, h);
            
            const position = determinePosition(points, w, h);
            updateStatus(position);
        }

        // --- ОБНОВЛЕНИЕ СТАТУСА ---
        function updateStatus(position) {
            currentPosition = position;

            let icon, text, className, dotClass, labelText, stateText, stateColor;

            switch(position) {
                case 'back':
                    icon = '✅';
                    text = 'На спине';
                    className = 'status-safe';
                    dotClass = 'dot';
                    labelText = 'Онлайн';
                    stateText = 'Безопасно';
                    stateColor = '#86efac';
                    stopAlarmLoop();
                    break;
                case 'side':
                    icon = '⚠️';
                    text = 'На боку';
                    className = 'status-warning';
                    dotClass = 'dot dot-warning';
                    labelText = 'Бок';
                    stateText = 'На боку';
                    stateColor = '#fbbf24';
                    stopAlarmLoop();
                    break;
                case 'stomach':
                    icon = '🔴';
                    text = 'НА ЖИВОТЕ!';
                    className = 'status-danger';
                    dotClass = 'dot dot-danger';
                    labelText = 'ТРЕВОГА';
                    stateText = '⚠️ ОПАСНО!';
                    stateColor = '#fca5a5';
                    startAlarmLoop();
                    break;
            }

            statusBadge.className = `status-badge ${className}`;
            statusText.innerText = text;
            document.querySelector('.status-badge .icon').innerHTML = icon;
            liveDot.className = dotClass;
            liveLabel.innerText = labelText;
            detectState.innerText = stateText;
            detectState.style.color = stateColor;

            if (lastPosition !== position) {
                lastPosition = position;
                const posNames = { back: 'спину', side: 'бок', stomach: 'живот' };
                logMessage(`🔄 Положение: ${posNames[position]}`);
                if (position === 'stomach') {
                    logMessage('🚨 РЕБЁНОК НА ЖИВОТЕ! ТРЕВОГА', true);
                }
                if (position === 'side' || position === 'stomach') {
                    timeSinceLastCapture = CAPTURE_INTERVAL - 5000;
                }
            }
        }

        // --- ЦИКЛ ---
        function startDetectionLoop() {
            if (!isRunning) return;

            function loop() {
                if (!isRunning) return;
                try {
                    analyzeFrame();
                } catch (e) {
                    // игнорируем
                }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // --- КАМЕРА (ИСПРАВЛЕННАЯ) ---
        async function startCamera(facingMode = 'environment') {
            try {
                // Останавливаем старый поток
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }

                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                    },
                    audio: false,
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                cameraState.innerText = 'Активна';
                cameraState.style.color = '#86efac';
                currentFacing = facingMode;
                logMessage(`📷 Камера запущена (${facingMode === 'environment' ? 'основная' : 'фронтальная'})`);
                return true;
            } catch (err) {
                console.error('Ошибка камеры:', err);
                cameraState.innerText = '❌ Ошибка';
                cameraState.style.color = '#f87171';
                logMessage('❌ Ошибка камеры: ' + err.message, true);
                
                // Показываем подсказку пользователю
                if (err.name === 'NotAllowedError') {
                    logMessage('❌ Доступ к камере запрещён. Разрешите доступ в настройках браузера.', true);
                } else if (err.name === 'NotFoundError') {
                    logMessage('❌ Камера не найдена. Проверьте подключение камеры.', true);
                }
                return false;
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            cameraState.innerText = 'Остановлена';
            cameraState.style.color = '#9bb7d4';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- ПЕРЕКЛЮЧЕНИЕ КАМЕРЫ (ИСПРАВЛЕННОЕ) ---
        async function switchCamera() {
            if (!isRunning) return;
            
            // Отключаем кнопку на время переключения
            switchCamBtn.disabled = true;
            switchCamBtn.textContent = '⏳ Переключение...';
            
            try {
                const newFacing = currentFacing === 'environment' ? 'user' : 'environment';
                const ok = await startCamera(newFacing);
                if (ok) {
                    logMessage(`🔄 Переключено на ${newFacing === 'environment' ? 'основную' : 'фронтальную'} камеру`);
                    // Сбрасываем таймер после переключения
                    timeSinceLastCapture = CAPTURE_INTERVAL - 3000;
                }
            } catch (e) {
                logMessage('❌ Ошибка переключения камеры', true);
            } finally {
                switchCamBtn.disabled = false;
                switchCamBtn.textContent = '🔄 Сменить камеру';
            }
        }

        // --- ЗАПУСК / ОСТАНОВКА ---
        async function startAll() {
            if (isRunning) return;

            // Блокируем кнопки на время запуска
            startBtn.disabled = true;
            startBtn.textContent = '⏳ Запуск...';

            try {
                const ok = await startCamera('environment');
                if (!ok) {
                    startBtn.disabled = false;
                    startBtn.textContent = '▶ Запуск';
                    return;
                }

                if (audioCtx && audioCtx.state === 'closed') {
                    audioCtx = null;
                }

                isRunning = true;
                startBtn.disabled = true;
                startBtn.textContent = '▶ Запуск';
                stopBtn.disabled = false;
                switchCamBtn.disabled = false;

                lastPosition = 'back';
                lastCaptureTime = 0;
                timeSinceLastCapture = 0;
                updateStatus('back');
                logMessage('🔍 Мониторинг запущен');

                startTimer();
                startDetectionLoop();
            } catch (e) {
                logMessage('❌ Ошибка запуска: ' + e.message, true);
                startBtn.disabled = false;
                startBtn.textContent = '▶ Запуск';
            }
        }

        function stopAll() {
            if (!isRunning) return;

            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            stopCamera();
            stopAlarmLoop();
            stopTimer();
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
                audioCtx = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            switchCamBtn.disabled = true;
            detectState.innerText = 'Остановлен';
            detectState.style.color = '#9bb7d4';
            liveDot.className = 'dot';
            liveLabel.innerText = 'Офлайн';
            logMessage('⏹ Мониторинг остановлен');
            statusBadge.className = 'status-badge status-safe';
            statusText.innerText = 'На спине';
            document.querySelector('.status-badge .icon').innerHTML = '✅';
        }

        // --- КНОПКИ ---
        startBtn.addEventListener('click', startAll);
        stopBtn.addEventListener('click', stopAll);
        switchCamBtn.addEventListener('click', switchCamera);

        window.addEventListener('load', () => {
            logMessage('🟢 Готов. Нажмите "Запуск"');
            cameraState.innerText = 'Ожидание';
            detectState.innerText = 'Готов';
            liveLabel.innerText = 'Офлайн';
            renderGallery();
        });

        window.addEventListener('beforeunload', () => {
            stopAll();
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isRunning && currentPosition === 'stomach') {
                stopAlarmLoop();
                startAlarmLoop();
            }
        });

    })();
</script>
